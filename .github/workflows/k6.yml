name: API Performance Testing (K6)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  k6-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Build Project
      run: pnpm run build

    - name: Create Dummy .env File
      run: |
        echo "PORT=8080" > .env
        echo "GROQ_API_KEY=dummy_key" >> .env

    - name: Start Backend Server
      run: |
        cd artifacts/api-server
        nohup pnpm run start > ../../backend.log 2>&1 &

    - name: Wait for API to be Ready
      run: |
        python -c "
        import socket, time
        port = 8080
        start_time = time.time()
        while True:
            try:
                s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                s.settimeout(1)
                s.connect(('127.0.0.1', port))
                s.close()
                print(f'API Port {port} is open and ready.')
                break
            except Exception:
                if time.time() - start_time > 60:
                    raise TimeoutError(f'Timed out waiting for port {port}')
                print(f'Waiting for port {port}...')
                time.sleep(2)
        "

    - name: Install K6
      run: |
        curl -L -o k6.tar.gz https://github.com/grafana/k6/releases/download/v0.51.0/k6-v0.51.0-linux-amd64.tar.gz
        tar -xzf k6.tar.gz
        sudo mv k6-v0.51.0-linux-amd64/k6 /usr/local/bin/

    - name: Run K6 API Load Tests
      run: |
        k6 run testing/k6-test.js

    - name: Dump Backend Server Logs (On Failure)
      if: always()
      run: |
        echo "========================================================="
        echo "                DETAILED BACKEND LOGS                    "
        echo "========================================================="
        if [ -f backend.log ]; then
          cat backend.log
        else
          echo "backend.log not found"
        fi
