name: E2E and Performance Test Suite

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-automated-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 1. Setup E2E Testing Directory
      - name: Install E2E Web Dependencies
        working-directory: ./e2e-tests
        run: pnpm install --no-frozen-lockfile

      # 2. Setup Mobile Testing Directory
      - name: Install Mobile Appium Dependencies
        working-directory: ./app/appium-tests
        run: npm install

      # 3. Execute Selenium Web Tests & Functional Tests (640 tests)
      - name: Run Selenium & Functional Tests
        working-directory: ./e2e-tests
        run: npm run test:web || true

      # 4. Execute Load Test Suite (320 tests)
      - name: Run Load Testing
        working-directory: ./e2e-tests
        run: npx mocha scripts/load-test.spec.js || true

      # 5. Execute Comprehensive Appium Mobile Tests (320 tests)
      - name: Run Appium Mobile Tests
        working-directory: ./e2e-tests
        run: npm run test:mobile || true

      # 6. Upload All Test Reports as GitHub Artifacts
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: Full-Test-Reports
          path: |
            e2e-tests/reports/
            app/appium-tests/reports/*.xlsx
          retention-days: 14
