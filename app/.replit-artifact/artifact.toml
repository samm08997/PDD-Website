kind = "mobile"
previewPath = "/"
title = "CramAI"
version = "1.0.0"
id = "artifacts/cram-ai"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24843

[services.development]
run = "pnpm --filter @workspace/cram-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cram-ai", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cram-ai", "run", "serve" ]

[services.env]
PORT = "24843"
BASE_PATH = "/"
